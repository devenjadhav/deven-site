<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../blog.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Podkova"
    />
    <title>Blog - Deven Jadhav</title>
  </head>

  <body>
    <div class="container">
      <div class="column heading">
        <a href="/">
          <img
            src="/symbol.svg"
            alt="Deven Jadhav Symbol"
            style="width: 75px; margin-right: 10px"
          />
        </a>
        <div>
          <h1><a href="/">Home</a></h1>
          <h1><a href="/blog">Blog</a></h1>
          <h1>Instagram</h1>
          <h1>Twitter</h1>
          <h1>LinkedIn</h1>
        </div>
      </div>

      <div class="column content blog-index">
        <h1 class="page-title">Blog</h1>
        
        <div class="blog-posts">
          <!-- Example post - duplicate this structure for each post -->
          <article class="post-preview">
            <h2 class="preview-title">
              <a href="/blog/example-post.html">Example Blog Post Title</a>
            </h2>
            <div class="preview-meta">
              <time datetime="2024-03-15">March 15, 2024</time>
              <span class="reading-time">5 min read</span>
            </div>
            <p class="preview-excerpt">
              This is a brief excerpt or summary of your blog post. It should give
              readers an idea of what the post is about and encourage them to click
              through to read more.
            </p>
            <div class="preview-tags">
              <span class="tag">Tag 1</span>
              <span class="tag">Tag 2</span>
            </div>
          </article>

          <!-- Add more post previews here -->
        </div>
      </div>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
