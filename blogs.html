<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/symbol.svg">
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Podkova:wght@400;500;600;700&display=swap"
    />
    <title>Deven's Blogs</title>
    <style>
      .blog-content {
        padding: 2rem;
        max-width: 800px;
        margin: 0 auto;
      }
      .sphere-top {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 3rem;
        margin-bottom: 2rem;
        gap: 24px;
      }
      .blog-list {
        list-style: none;
        padding: 0;
      }
      .blog-item {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .blog-title {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
        color: var(--primary-color);
      }
      .blog-date {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }
      .blog-excerpt {
        line-height: 1.6;
      }
      .blog-title a {
        color: var(--primary-color);
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .blog-title a:hover {
        color: var(--link-hover-color);
        background-color: var(--link-hover-bg);
      }
    </style>
  </head>
  <body>
    <div class="sphere-top">
      <img src="/symbol.svg" alt="Deven Jadhav Symbol" class="sphere sphere-1" />
      <img src="/symbol.svg" alt="Deven Jadhav Symbol" class="sphere sphere-2" />
      <img src="/symbol.svg" alt="Deven Jadhav Symbol" class="sphere sphere-3" />
    </div>
    <div class="blog-content">
      <h1>Blog Posts</h1>
      <ul class="blog-list">
        <li class="blog-item">
          <h2 class="blog-title"><a href="reading-list-2025.html">My 2025 Reading List</a></h2>
          <div class="blog-date">May 12, 2025</div>
          <p class="blog-excerpt">
            Here's what I'm reading right now! A lot of these are books I've been meaning to read for a while, and I'm excited to get started!
          </p>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
